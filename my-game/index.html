<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="apptJs6j2dGba_YRiUBj2ueaHNvBHNshKIMn5cY7pyU" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Would You Rather? — Multiplayer</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
  <style>
    :root {
      --bg:#0d0d1a; --card:#16162a; --a1:#ff4d6d; --a2:#00c2ff;
      --a3:#ffd60a; --txt:#f0f0ff; --mut:#6668a0;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    @keyframes drift1{to{transform:translate(80px,80px)}}
    @keyframes drift2{to{transform:translate(-60px,-60px)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    @keyframes popIn{from{transform:scale(.5) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
    @keyframes chipIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes coinFly{0%{opacity:0;transform:translateX(-50%) translateY(0)}12%{opacity:1}75%{opacity:1;transform:translateX(-50%) translateY(-65px)}100%{opacity:0;transform:translateX(-50%) translateY(-95px)}}
    @keyframes revDrop{from{transform:scale(.78) translateY(28px);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
    @keyframes flapWing{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
    #flappy-overlay{position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;backdrop-filter:blur(4px)}
    #flappy-canvas{border-radius:16px;border:2px solid rgba(255,255,255,.1);box-shadow:0 0 40px rgba(0,194,255,.2);max-width:100%;cursor:pointer;touch-action:none}
    #flappy-hud{font-family:'Bangers',cursive;font-size:1.1rem;color:var(--mut);letter-spacing:1px;text-align:center}
    #flappy-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);border-radius:50%;width:36px;height:36px;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
    @keyframes glowPulse{0%,100%{box-shadow:0 0 0 2px transparent}50%{box-shadow:0 0 0 3px var(--a3)}}

    body{background:var(--bg);color:var(--txt);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}
    #app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 80px;position:relative}
    .blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
    .b1{width:500px;height:500px;background:var(--a1);top:-150px;left:-150px;opacity:.13;animation:drift1 13s ease-in-out infinite alternate}
    .b2{width:450px;height:450px;background:var(--a2);bottom:-150px;right:-100px;opacity:.11;animation:drift2 16s ease-in-out infinite alternate}
    #root{position:relative;z-index:1;width:100%;max-width:660px}
    .wrap{display:flex;flex-direction:column;align-items:center;gap:16px;animation:fadeUp .4s ease both;padding-bottom:24px}
    .title{font-family:'Bangers',cursive;font-size:clamp(2.6rem,8vw,4.8rem);letter-spacing:4px;text-align:center;background:linear-gradient(135deg,var(--a1),var(--a3),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:popIn .5s cubic-bezier(.175,.885,.32,1.275) both;line-height:1}
    .sub{color:var(--mut);font-size:.78rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-top:-8px}
    .card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:22px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);display:flex;flex-direction:column;gap:13px}
    .lbl{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut)}
    input.inp{width:100%;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:var(--txt);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;outline:none;transition:border-color .2s,box-shadow .2s}
    input.inp:focus{border-color:var(--a2);box-shadow:0 0 0 3px rgba(0,194,255,.17)}
    input.inp::placeholder{color:var(--mut)}
    input.inp.shake{animation:shake .35s ease}
    input.code-inp{text-transform:uppercase;font-size:1.4rem;letter-spacing:6px;text-align:center;font-family:'Bangers',cursive}
    .btn{padding:12px 22px;border:none;border-radius:12px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:800;transition:transform .15s,box-shadow .15s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
    .btn:hover:not(:disabled){transform:translateY(-2px)}
    .btn:active:not(:disabled){transform:scale(.97)}
    .btn:disabled{opacity:.38;cursor:not-allowed;transform:none!important}
    .btn-p{background:linear-gradient(135deg,var(--a1),#c9184a);color:#fff;box-shadow:0 5px 18px rgba(255,77,109,.35)}
    .btn-s{background:linear-gradient(135deg,var(--a2),#0077b6);color:#fff;box-shadow:0 5px 18px rgba(0,194,255,.3)}
    .btn-g{background:linear-gradient(135deg,#3ddc84,#20a060);color:#0d1a14;box-shadow:0 5px 18px rgba(61,220,132,.3)}
    .btn-ghost{background:transparent;border:2px solid rgba(255,255,255,.14);color:var(--txt)}
    .btn-ghost:hover:not(:disabled){border-color:var(--a2);background:rgba(0,194,255,.08)}
    .btn-full{width:100%;padding:14px}
    .btn-row{display:flex;gap:10px;width:100%}
    .btn-row .btn{flex:1}
    .room-code{font-family:'Bangers',cursive;font-size:clamp(1.8rem,9vw,3.4rem);letter-spacing:10px;text-align:center;color:var(--a3);text-shadow:0 0 28px rgba(255,214,10,.6);background:rgba(255,214,10,.08);border:1px dashed rgba(255,214,10,.4);border-radius:14px;padding:14px 18px;cursor:pointer;transition:background .2s;user-select:all;width:100%;display:block}
    .room-code:hover{background:rgba(255,214,10,.16)}
    .chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:50px;padding:5px 13px;font-size:.82rem;font-weight:700;animation:chipIn .3s cubic-bezier(.175,.885,.32,1.275) both}
    .chip-me{border-color:var(--a2);background:rgba(0,194,255,.1)}
    .chip-host::after{content:' 👑'}
    .chips-wrap{display:flex;flex-wrap:wrap;gap:7px}
    .st{font-size:.8rem;font-weight:700;color:var(--mut);text-align:center;min-height:16px}
    .st-err{color:var(--a1)!important}
    .st-ok{color:var(--a2)!important}
    .waiting{background:rgba(255,214,10,.07);border:1px solid rgba(255,214,10,.22);border-radius:50px;padding:9px 20px;color:var(--a3);font-size:.8rem;font-weight:700;text-align:center;animation:pulse 1.8s ease-in-out infinite;width:100%}
    .loader{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.14);border-top-color:var(--a2);border-radius:50%;animation:spin .7s linear infinite;margin-right:6px;vertical-align:middle}
    .divider{width:100%;height:1px;background:rgba(255,255,255,.07)}
    .sec{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut)}
    .row-between{display:flex;justify-content:space-between;align-items:center;width:100%}
    .q-card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:22px 26px;text-align:center;width:100%;font-size:clamp(.95rem,2.6vw,1.1rem);font-weight:700;line-height:1.55;box-shadow:0 8px 32px rgba(0,0,0,.4)}
    .or{font-family:'Bangers',cursive;font-size:1.5rem;letter-spacing:3px;color:var(--a3);text-shadow:0 0 18px rgba(255,214,10,.5)}
    .or::before,.or::after{content:'✦';margin:0 8px;font-size:.58rem;vertical-align:middle;opacity:.5}
    .opts{display:flex;flex-direction:column;gap:10px;width:100%}
    .opt{width:100%;padding:16px 20px;border:none;border-radius:18px;font-family:'Nunito',sans-serif;font-size:clamp(.88rem,2.3vw,.98rem);font-weight:800;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s,opacity .2s;position:relative;overflow:hidden;color:#fff}
    .opt::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background .15s}
    .opt:hover:not(:disabled)::after{background:rgba(255,255,255,.09)}
    .opt:hover:not(:disabled){transform:translateY(-3px)}
    .opt:active:not(:disabled){transform:scale(.97)}
    .opt:disabled{cursor:not-allowed;transform:none}
    .opt1{background:linear-gradient(135deg,#ff4d6d,#c9184a);box-shadow:0 5px 20px rgba(255,77,109,.35)}
    .opt2{background:linear-gradient(135deg,#00c2ff,#0077b6);box-shadow:0 5px 20px rgba(0,194,255,.3)}
    .opt:disabled:not(.chosen){opacity:.3}
    .chosen{opacity:1!important;box-shadow:0 0 0 3px var(--a3),0 12px 28px rgba(0,0,0,.5)!important;transform:scale(1.015)!important;animation:glowPulse 2s ease infinite}
    .ans-bar{width:100%;background:var(--card);border-radius:50px;border:1px solid rgba(255,255,255,.07);padding:9px 18px;display:flex;align-items:center;gap:10px;font-size:.84rem;font-weight:700;color:var(--mut)}
    .fill-t{height:6px;flex:1;background:rgba(255,255,255,.08);border-radius:50px;overflow:hidden}
    .fill-i{height:100%;background:linear-gradient(90deg,var(--a1),var(--a3));border-radius:50px;transition:width .4s ease}
    .prog-t{width:100%;height:3px;background:rgba(255,255,255,.07);border-radius:50px;overflow:hidden}
    .prog-f{height:100%;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:50px;transition:width .5s ease}
    .rev-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
    @media(max-width:480px){.rev-grid{grid-template-columns:1fr}}
    .rev-col{border-radius:18px;overflow:hidden;animation:revDrop .5s cubic-bezier(.175,.885,.32,1.275) both}
    .rev-col:nth-child(2){animation-delay:.1s}
    .rv-h1{padding:12px 14px;font-size:.78rem;font-weight:800;line-height:1.4;background:linear-gradient(135deg,#ff4d6d,#c9184a);color:#fff}
    .rv-h2{padding:12px 14px;font-size:.78rem;font-weight:800;line-height:1.4;background:linear-gradient(135deg,#00c2ff,#0077b6);color:#fff}
    .rv-ppl{background:rgba(255,255,255,.04);padding:10px;display:flex;flex-wrap:wrap;gap:6px;min-height:52px;align-content:flex-start}
    .rv-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.08);border-radius:50px;padding:4px 10px;font-size:.78rem;font-weight:700;animation:chipIn .35s cubic-bezier(.175,.885,.32,1.275) both}
    .no-votes{color:var(--mut);font-size:.74rem;font-style:italic}
    .resp{background:rgba(255,214,10,.07);border:1px solid rgba(255,214,10,.18);border-radius:14px;padding:12px 16px;font-size:.84rem;font-weight:600;line-height:1.5;width:100%;animation:fadeUp .4s ease both}
    .resp-lbl{color:var(--a3);font-weight:800;font-size:.68rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
    .coin-bar{display:inline-flex;align-items:center;gap:6px;background:rgba(255,214,10,.1);border:1px solid rgba(255,214,10,.22);border-radius:50px;padding:7px 14px;font-size:.82rem;font-weight:800;color:var(--a3);white-space:nowrap}
    .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;width:100%}
    @media(max-width:420px){.menu-grid{grid-template-columns:1fr}}
    .menu-btn{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;transition:border-color .2s,background .2s,transform .15s;font-family:'Nunito',sans-serif}
    .menu-btn:hover{transform:translateY(-3px);border-color:var(--a2);background:rgba(0,194,255,.06)}
    .menu-ico{font-size:2.4rem}
    .menu-t{font-size:.95rem;font-weight:800;color:var(--txt);text-align:center}
    .menu-s{font-size:.72rem;font-weight:600;color:var(--mut);text-align:center}
    .back-btn{background:transparent;border:none;color:var(--mut);font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:4px 0;transition:color .2s;align-self:flex-start}
    .back-btn:hover{color:var(--txt)}
    .tabs{display:flex;width:100%;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
    .tab{flex:1;padding:11px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;cursor:pointer;border:none;transition:background .2s,color .2s;text-align:center}
    .tab-on{background:var(--a1);color:#fff}
    .tab-off{background:rgba(255,255,255,.04);color:var(--mut)}
    .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:9px;width:100%}
    .s-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:13px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
    .s-item:hover{transform:translateY(-2px);border-color:var(--a2)}
    .s-owned{border-color:rgba(255,214,10,.38);background:rgba(255,214,10,.05)}
    .s-eq{border-color:var(--a3);background:rgba(255,214,10,.1);box-shadow:0 0 0 2px rgba(255,214,10,.35)}
    .s-ico{font-size:2.1rem;line-height:1}
    .s-name{font-size:.76rem;font-weight:800;color:var(--txt);text-align:center}
    .s-cost{font-size:.72rem;font-weight:700;color:var(--a3)}
    .t-prev{width:100%;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.08);margin-bottom:1px}
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%}
    .stat-c{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:13px 10px;text-align:center;display:flex;flex-direction:column;gap:3px}
    .stat-n{font-family:'Bangers',cursive;font-size:1.7rem;color:var(--a3);letter-spacing:1px}
    .stat-l{font-size:.7rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
    .maj-badge{background:linear-gradient(135deg,var(--a3),var(--a1));color:#fff;border-radius:50px;padding:8px 18px;font-size:.85rem;font-weight:800;text-align:center;width:100%}
    .gen-banner{background:rgba(0,194,255,.08);border:1px solid rgba(0,194,255,.2);border-radius:12px;padding:12px 16px;text-align:center;font-size:.85rem;font-weight:700;color:var(--a2);width:100%}
    .go-icon{font-size:4.2rem;animation:popIn .6s cubic-bezier(.175,.885,.32,1.275) both}
    /* Leaderboard */
    .lb-tab-on{background:var(--a3);color:#0d1a14}
    .lb-tab-off{background:rgba(255,255,255,.04);color:var(--mut)}
    .lb-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);transition:background .2s}
    .lb-row.lb-me{background:rgba(255,214,10,.07);border-color:rgba(255,214,10,.25)}
    .lb-rank{font-family:'Bangers',cursive;font-size:1.4rem;min-width:32px;text-align:center;letter-spacing:1px}
    .lb-rank-1{color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,.6)}
    .lb-rank-2{color:#c0c0c0;text-shadow:0 0 8px rgba(192,192,192,.4)}
    .lb-rank-3{color:#cd7f32;text-shadow:0 0 8px rgba(205,127,50,.4)}
    .lb-ico{font-size:1.6rem}
    .lb-name{flex:1;font-weight:800;font-size:.95rem}
    .lb-val{font-family:'Bangers',cursive;font-size:1.5rem;letter-spacing:1px;color:var(--a3)}
    .lb-sub{font-size:.65rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
    .go-title{font-family:'Bangers',cursive;font-size:clamp(2.2rem,8vw,3.6rem);letter-spacing:4px;text-align:center;background:linear-gradient(135deg,var(--a3),var(--a1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .user-list{display:flex;flex-wrap:wrap;gap:7px}
    .user-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:50px;padding:6px 15px;color:var(--txt);font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;transition:border-color .2s,background .2s}
    .user-btn:hover{border-color:var(--a2);background:rgba(0,194,255,.1)}
    .quick-acc-btn{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:14px;cursor:pointer;transition:border-color .2s,background .2s,transform .12s;font-family:'Nunito',sans-serif;color:var(--txt)}
    .quick-acc-btn:hover{border-color:var(--a2);background:rgba(0,194,255,.07);transform:translateY(-2px)}
    .quick-acc-btn:active{transform:scale(.98)}
    /* Chat */
    #chat-fab-wrap{position:fixed;bottom:68px;right:20px;z-index:200}
    #chat-fab-wrap button{width:52px;height:52px;background:linear-gradient(135deg,var(--a1),var(--a2));border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:0 6px 22px rgba(0,0,0,.45);transition:transform .2s}
    #chat-fab-wrap button:hover{transform:scale(1.1)}
    #chat-badge{position:absolute;top:-4px;right:-4px;background:#ff4d6d;color:#fff;font-size:.6rem;font-weight:800;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);pointer-events:none}
    .chat-drawer{position:fixed;bottom:0;left:0;right:0;height:70vh;max-height:520px;background:var(--card);border-top:1px solid rgba(255,255,255,.1);border-radius:22px 22px 0 0;z-index:300;display:flex;flex-direction:column;box-shadow:0 -10px 50px rgba(0,0,0,.6);animation:slideUp .3s cubic-bezier(.175,.885,.32,1.275) both}
    .chat-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
    .chat-title-txt{font-family:'Bangers',cursive;font-size:1.4rem;letter-spacing:2px;color:var(--a3)}
    .chat-close{background:rgba(255,255,255,.08);border:none;color:var(--txt);font-size:1rem;cursor:pointer;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif}
    .chat-msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:9px}
    .chat-msgs::-webkit-scrollbar{width:4px}
    .chat-msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
    .msg{display:flex;flex-direction:column;gap:2px;max-width:78%;animation:msgIn .25s ease both}
    .msg-me{align-self:flex-end;align-items:flex-end}
    .msg-them{align-self:flex-start;align-items:flex-start}
    .msg-name{font-size:.65rem;font-weight:800;color:var(--mut)}
    .msg-bubble{padding:9px 13px;border-radius:14px;font-size:.86rem;font-weight:600;line-height:1.4;word-break:break-word}
    .msg-me .msg-bubble{background:var(--a1);color:#fff;border-bottom-right-radius:4px}
    .msg-them .msg-bubble{background:rgba(255,255,255,.09);color:var(--txt);border-bottom-left-radius:4px}
    .msg-sys{align-self:center;font-size:.72rem;font-weight:700;color:var(--mut);font-style:italic;text-align:center}
    .chat-input-row{display:flex;gap:9px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.07)}
    .chat-inp{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 14px;color:var(--txt);font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:600;outline:none}
    .chat-inp:focus{border-color:var(--a2)}
    .chat-inp::placeholder{color:var(--mut)}
    .chat-send{background:linear-gradient(135deg,var(--a1),var(--a2));border:none;border-radius:12px;padding:10px 16px;color:#fff;font-weight:800;cursor:pointer;font-size:.9rem;transition:transform .15s;font-family:'Nunito',sans-serif}
    .chat-send:hover{transform:scale(1.05)}
    /* Toast & Coins */

function saveAcc(a){if(!a)return;try{localStorage.setItem('acc:'+a.username,JSON.stringify(a));localStorage.setItem('lastUser',a.username);}catch(e){}}
function loadAcc(u){try{const r=localStorage.getItem('acc:'+u);return r?JSON.parse(r):null;}catch(e){return null;}}
function getAllUsers(){const u=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('acc:'))u.push(k.slice(4));}return u;}
function mkAcc(u,pw){return{username:u,password:pw,coins:100,iconId:'fox',themeId:'void',ownedIcons:[...FREE_ICONS],ownedThemes:['void'],gamesPlayed:0,questionsAnswered:0,majorityWins:0,totalCoinsEarned:100};}

function syncGlobalStats(){}
function mergeLbEntry(){}

/* ═══════════════════════════════════════
   THEME
═══════════════════════════════════════ */
function applyTheme(tid){
  const t=THEMES[tid]||THEMES.void;
  const r=document.documentElement;
  r.style.setProperty('--bg',t.bg); r.style.setProperty('--card',t.card);
  r.style.setProperty('--a1',t.a1); r.style.setProperty('--a2',t.a2);
  r.style.setProperty('--a3',t.a3); r.style.setProperty('--txt',t.txt);
  r.style.setProperty('--mut',t.mut);
  document.body.style.background=t.bg;
  document.querySelector('.footer').style.background='rgba('+hexToRgb(t.bg)+',.88)';
}
function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return r+','+g+','+b;}

/* ═══════════════════════════════════════
   UI HELPERS
═══════════════════════════════════════ */
function showToast(msg){
  const el=document.getElementById('toast-el');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600);
}
function awardCoins(amt,reason){
  S.account.coins+=amt; S.account.totalCoinsEarned+=amt; saveAcc(S.account);
  const el=document.getElementById('coins-el');
  el.textContent='+'+amt+' 🪙 '+reason;
  el.className=''; void el.offsetWidth; el.className='fly';
  clearTimeout(el._t); el._t=setTimeout(()=>{el.className='';},3000);
}
function spawnConfetti(color){
  const cols=[color,'#ffd60a','#fff','#ff9f1c'];
  for(let i=0;i<22;i++){
    const d=document.createElement('div');
    const rn=Math.random;
    d.style.cssText=`position:fixed;width:${5+rn()*7}px;height:${5+rn()*7}px;background:${cols[~~(rn()*cols.length)]};border-radius:${rn()>.5?'50%':'3px'};left:${15+rn()*70}vw;top:50vh;pointer-events:none;z-index:9998;opacity:1;transition:transform ${.6+rn()*.7}s ease-out,opacity ${.4+rn()*.4}s ease-out ${.35+rn()*.3}s;`;
    document.body.appendChild(d);
    requestAnimationFrame(()=>{
      const a=(rn()*260-130)*Math.PI/180,dist=80+rn()*200;
      d.style.transform=`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist-120}px) rotate(${rn()*360}deg)`;
      d.style.opacity='0';
    });
    setTimeout(()=>d.remove(),1400);
  }
}
function copyCode(){navigator.clipboard.writeText(S.roomId).catch(()=>{});showToast('✓ Room code copied!');}
function escHtml(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function cssVar(v){return getComputedStyle(document.documentElement).getPropertyValue('--'+v).trim();}

/* ═══════════════════════════════════════
   SCREEN ROUTER
═══════════════════════════════════════ */
function showScreen(name){
  S.screen=name;
  if(S.account)applyTheme(S.account.themeId);
  const builders={
    login:buildLogin, menu:buildMenu, shop:buildShop, solo:buildSolo, soloGameover:buildSoloGameover,
    mpSetup:buildMpSetup, mpLobby:buildMpLobby, mpGame:buildMpGame,
    mpReveal:buildMpReveal, mpGameover:buildMpGameover
  };
  document.getElementById('root').innerHTML='<div class="wrap">'+(builders[name]?builders[name]():'')+'</div>';
  updateChatFab(); window.scrollTo(0,0); afterRender(name);
}

function afterRender(n){
  if(n==='login'){
    const ln=document.getElementById('ln'), lp=document.getElementById('lp');
    const last=localStorage.getItem('lastUser');
    if(ln&&last&&!ln.value)ln.value=last;
    if(ln)ln.addEventListener('keydown',e=>{if(e.key==='Enter')lp?.focus();});
    if(lp)lp.addEventListener('keydown',e=>{if(e.key==='Enter')handleAuth();});
  }
  if(n==='mpSetup'){
    const c=document.getElementById('join-code');
    if(c){c.addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom();});
          c.addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase();});}
  }
}

    <div style="flex:1;height:1px;background:rgba(255,255,255,.08)"></div>

  ${!atLimit?`<div class="card">

    ${!S.isSignup?'<button class="btn btn-ghost btn-full" style="font-size:.82rem;margin-top:-4px" onclick="showForgotPassword()">🔑 Forgot Password?</button>':''}

/* ═══════════════════════════════════════
   QUESTION BANK (loaded from questions.json)
═══════════════════════════════════════ */
let QUESTION_BANK = [];
let BANK_USED_IDS = new Set();

async function loadQuestionBank(){
  if(QUESTION_BANK.length > 0) return true;
  try{
    const resp = await fetch('questions.json');
    if(!resp.ok) throw new Error('Failed to load');
    QUESTION_BANK = await resp.json();
    // Shuffle the bank
    for(let i = QUESTION_BANK.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [QUESTION_BANK[i], QUESTION_BANK[j]] = [QUESTION_BANK[j], QUESTION_BANK[i]];
    }
    return true;
  }catch(e){
    console.error('Could not load questions.json:', e);
    return false;
  }
}

function pickQuestions(count){
  // If we've used most questions, reset the used set
  if(BANK_USED_IDS.size > QUESTION_BANK.length - count){
    BANK_USED_IDS.clear();
  }
  const available = QUESTION_BANK.filter(q => !BANK_USED_IDS.has(q.id));
  const picked = [];
  for(let i = available.length - 1; i > 0 && picked.length < count; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [available[i], available[j]] = [available[j], available[i]];
    picked.push(available[i]);
    BANK_USED_IDS.add(available[i].id);
  }
  // Fill remaining if needed
  while(picked.length < count && QUESTION_BANK.length > 0){
    const q = QUESTION_BANK[Math.floor(Math.random() * QUESTION_BANK.length)];
    if(!picked.find(p => p.id === q.id)){
      picked.push(q);
      BANK_USED_IDS.add(q.id);
    }
  }
  return picked;
}

async function generateQs(){
  if(S.isGenning) return;
  S.isGenning = true;
  S.genError = false;
  const loaded = await loadQuestionBank();
  if(!loaded || QUESTION_BANK.length === 0){
    S.isGenning = false;
    S.genError = true;
    if(S.screen==='solo'||S.screen==='mpLobby') showScreen(S.screen);
    return;
  }
  const newQs = pickQuestions(20);
  S.questions = [...S.questions, ...newQs];
  S.isGenning = false;
  if(S.screen==='solo') showScreen('solo');
  if(S.screen==='mpLobby') showScreen('mpLobby');
  if(S.isHost && S.conns.length > 0) broadcast({type:'moreQs', questions:S.questions});
}

function startHost(isRetry){
  if(!window.Peer){setMpErr('PeerJS loading, try again in a second…');return;}
  if(!isRetry){
    setMpErr('');
    S.conns=[]; S.hostAnswers={}; S.hostPlayers=[]; S.mpPlayers=[];

    S.questions=[]; S.qIdx=0; S.myAnswer=null; S.genError=false;
  }
  if(S.peer){try{S.peer.destroy();}catch(e){} S.peer=null;}
  S.peer=new Peer(genRoomCode(),{debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});
  S.peer.on('open',id=>{
    S.myPeerId=id; S.roomId=id;
    const me={id,name:S.account.username,emoji:ICONS[S.account.iconId].e};
    S.hostPlayers=[me]; S.mpPlayers=[me];
    showScreen('mpLobby'); generateQs();
  });
  S.peer.on('connection',conn=>{
    if(S.screen!=='mpLobby'){conn.on('open',()=>{conn.send({type:'error',msg:'Game already in progress!'});setTimeout(()=>conn.close(),500);});return;}
    setupHostConn(conn);
  });
  S.peer.on('error',err=>{
    if(err.type==='unavailable-id'){startHost(true);}
    else setMpErr('Connection error: '+err.message+'. Please try again.');
  });
}

function setupHostConn(conn){
  conn.on('open',()=>{
    S.conns.push(conn);
    conn.send({type:'welcome',players:S.hostPlayers,questions:S.questions});
  });
  conn.on('data',msg=>{
    if(msg.type==='join'){
      if(!S.hostPlayers.find(p=>p.id===conn.peer)){
        const np={id:conn.peer,name:msg.name,emoji:msg.emoji};
        S.hostPlayers.push(np); S.mpPlayers=[...S.hostPlayers];
        broadcast({type:'players',players:S.hostPlayers});
        addChatMsg({sys:true,emoji:'🔔',text:msg.name+' joined the room!',mine:false});
        if(S.screen==='mpLobby')showScreen('mpLobby');
      }
    }
    if(msg.type==='answer'){
      if(S.hostAnswers[conn.peer]!==undefined)return;
      S.hostAnswers[conn.peer]=msg.opt;
      const cnt=Object.keys(S.hostAnswers).length;
      broadcast({type:'ansCount',count:cnt}); updateAnsBar(cnt);
      if(cnt>=S.hostPlayers.length)setTimeout(doReveal,700);
    }
    if(msg.type==='chat'){broadcast(msg);addChatMsg({...msg,mine:false});}

  });
  conn.on('close',()=>{
    S.conns=S.conns.filter(c=>c!==conn);
    const pl=S.hostPlayers.find(p=>p.id===conn.peer);
    if(pl){
      addChatMsg({sys:true,emoji:'🔕',text:pl.name+' left the game.',mine:false});
      S.hostPlayers=S.hostPlayers.filter(p=>p.id!==conn.peer);
      S.mpPlayers=[...S.hostPlayers];
      broadcast({type:'players',players:S.hostPlayers});
      // If mid-game, check if everyone remaining has already answered
      if(S.screen==='mpGame'||S.screen==='mpReveal'){
        const answeredRemaining=S.hostPlayers.filter(p=>S.hostAnswers[p.id]!==undefined).length;
        const total=S.hostPlayers.length;
        if(total>0&&answeredRemaining>=total){
          setTimeout(doReveal,700);
        } else if(total===0){
          showToast('All players left. Ending game.');
          showScreen('mpGameover');
        } else {
          // update answer bar for remaining players
          const cnt=Object.keys(S.hostAnswers).filter(id=>S.hostPlayers.find(p=>p.id===id)).length;
          broadcast({type:'ansCount',count:cnt});
          updateAnsBar(cnt);
          if(S.screen==='mpGame') showScreen('mpGame');
        }
      } else if(S.screen==='mpLobby'){
        showScreen('mpLobby');
      }
    }
  });
  conn.on('error',()=>{S.conns=S.conns.filter(c=>c!==conn);});
}

function broadcast(msg){S.conns.forEach(c=>{if(c.open)c.send(msg);});}

function doReveal(){
  // Filter answers to only players still in the game
  const currentAnswers={};
  S.hostPlayers.forEach(p=>{if(S.hostAnswers[p.id]!==undefined)currentAnswers[p.id]=S.hostAnswers[p.id];});
  const revData={answers:currentAnswers,players:[...S.hostPlayers],q:S.questions[S.qIdx]};
  S.mpReveal=revData;
  broadcast({type:'reveal',data:revData});
  const myOpt=currentAnswers[S.myPeerId];
  if(myOpt){
    const c1=Object.values(currentAnswers).filter(v=>v===1).length;
    const c2=Object.values(currentAnswers).filter(v=>v===2).length;
    const maj=c1>c2?1:c2>c1?2:0;
    if(maj===myOpt){setTimeout(()=>awardCoins(15,'majority match! 🎯'),600);S.account.majorityWins++;saveAcc(S.account);}
    else setTimeout(()=>awardCoins(5,'for answering!'),600);
  }
  showScreen('mpReveal');
}

/* ═══════════════════════════════════════
   AI BOT
═══════════════════════════════════════ */
function hostStartGame(){
  if(S.mpPlayers.length<2){updateLobbyStatus('Need at least 2 players!');return;}
  S.hostAnswers={}; S.mpAnsweredCount=0; S.myAnswer=null; S.qIdx=0;
  broadcast({type:'startGame',questions:S.questions,qIdx:0});
  showScreen('mpGame');
}

function hostNextQ(){
  S.qIdx++; S.hostAnswers={}; S.mpAnsweredCount=0; S.myAnswer=null;
  if(S.qIdx>=20){hostEndGame();return;}
  if(S.questions.length-S.qIdx<5)generateQs();
  broadcast({type:'nextQ',qIdx:S.qIdx,questions:S.questions});
  showScreen('mpGame');
}

function hostEndGame(){
  broadcast({type:'gameover'});
  S.account.gamesPlayed++; saveAcc(S.account);
  showScreen('mpGameover');
}

function backToMenu(){
  closeFlappy();
  if(S.peer){try{S.peer.destroy();}catch(e){}} S.peer=null;
  S.conns=[]; S.hostConn=null; S.mpPlayers=[];
  showScreen('menu');
}

/* ═══════════════════════════════════════
   MULTIPLAYER CLIENT
═══════════════════════════════════════ */
function joinRoom(){
  if(!window.Peer){setMpErr('PeerJS loading, try again…');return;}
  const code=(document.getElementById('join-code')?.value||'').trim().toUpperCase();
  if(!code||code.length<4){setMpErr('Enter a valid room code.');return;}
  setMpErr('Connecting…');
  S.mpPlayers=[]; S.chatMsgs=[]; S.unread=0;
  S.questions=[]; S.qIdx=0; S.myAnswer=null; S.mpReveal=null;
  if(S.peer){try{S.peer.destroy();}catch(e){}}
  S.peer=new Peer(null,{debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});
  let joinTimeout;
  S.peer.on('open',id=>{
    S.myPeerId=id; S.roomId=code;
    const conn=S.peer.connect(code,{reliable:true});
    S.hostConn=conn;
    joinTimeout=setTimeout(()=>{if(S.screen!=='mpLobby')setMpErr('Timed out — check the room code and try again.');},8000);
    conn.on('open',()=>{
      clearTimeout(joinTimeout);
      conn.send({type:'join',name:S.account.username,emoji:ICONS[S.account.iconId].e});
      // Share our score + full lb cache with host so it spreads to all players
    setMpErr('');showScreen('mpLobby');
    });
    conn.on('data',msg=>handleClientMsg(msg));
    conn.on('close',()=>showToast('Disconnected from host.'));
    conn.on('error',()=>{clearTimeout(joinTimeout);setMpErr('Connection failed — check code.');});
  });
  S.peer.on('error',e=>{
    clearTimeout(joinTimeout);
    if(e.type==='peer-unavailable')setMpErr('Room not found. Double-check the code.');
    else setMpErr('Could not connect. Check the room code.');
  });
}

function handleClientMsg(msg){
  if(msg.type==='welcome'){S.mpPlayers=msg.players;if(msg.questions)S.questions=msg.questions;if(S.screen==='mpLobby')showScreen('mpLobby');}
  if(msg.type==='players'){S.mpPlayers=msg.players;if(S.screen==='mpLobby')showScreen('mpLobby');}
  if(msg.type==='moreQs'){S.questions=msg.questions;}
  if(msg.type==='startGame'){closeFlappy();S.questions=msg.questions||S.questions;S.qIdx=msg.qIdx||0;S.myAnswer=null;S.mpAnsweredCount=0;showScreen('mpGame');}
  if(msg.type==='ansCount'){S.mpAnsweredCount=msg.count;updateAnsBar(msg.count);}
  if(msg.type==='reveal'){
    S.mpReveal=msg.data;
    const myOpt=S.myAnswer;
    if(myOpt&&msg.data?.answers){
      const c1=Object.values(msg.data.answers).filter(v=>v===1).length;
      const c2=Object.values(msg.data.answers).filter(v=>v===2).length;
      const maj=c1>c2?1:c2>c1?2:0;
      if(maj===myOpt){setTimeout(()=>awardCoins(15,'majority match! 🎯'),600);S.account.majorityWins++;saveAcc(S.account);}
      else setTimeout(()=>awardCoins(5,'for answering!'),600);
    }
    showScreen('mpReveal');
  }
  if(msg.type==='nextQ'){if(msg.questions)S.questions=msg.questions;S.qIdx=msg.qIdx;S.myAnswer=null;S.mpAnsweredCount=0;showScreen('mpGame');}
  if(msg.type==='gameover'){S.account.gamesPlayed++;saveAcc(S.account);showScreen('mpGameover');}
  if(msg.type==='playAgain'){S.qIdx=0;S.myAnswer=null;S.questions=[];S.mpAnsweredCount=0;showScreen('mpLobby');}
  if(msg.type==='chat'){addChatMsg({...msg,mine:false});}

  if(msg.type==='error'){setMpErr(msg.msg);}
}

/* ═══════════════════════════════════════
   MP SHARED HELPERS
═══════════════════════════════════════ */
function mpChoose(opt){
  if(S.myAnswer!==null)return;
  S.myAnswer=opt; spawnConfetti(opt===1?cssVar('a1'):cssVar('a2'));
  S.account.questionsAnswered++; saveAcc(S.account);
  showScreen('mpGame');
  // Pre-fetch next questions in background while waiting for others
  generateQs();
  if(S.isHost){
    S.hostAnswers[S.myPeerId]=opt;
    const cnt=Object.keys(S.hostAnswers).length;
    broadcast({type:'ansCount',count:cnt}); updateAnsBar(cnt);
    if(cnt>=S.hostPlayers.length)setTimeout(doReveal,700);
  } else {
    S.hostConn?.send({type:'answer',opt});
  }
}

function updateAnsBar(cnt){
  const lbl=document.getElementById('ans-lbl'), fill=document.getElementById('ans-fill');
  if(lbl)lbl.textContent=cnt+'/'+S.mpPlayers.length;
  if(fill)fill.style.width=(S.mpPlayers.length>0?(cnt/S.mpPlayers.length)*100:0)+'%';
}

function updateLobbyStatus(msg){
  S.mpStatus=msg;
  const el=document.getElementById('lobby-st');
  if(el){el.textContent=msg;el.className='st '+(msg.startsWith('Need')||msg.startsWith('Error')?'st-err':'st-ok');}
  else showScreen('mpLobby');
}

function setMpErr(msg){
  const el=document.getElementById('mp-err');
  if(el){el.textContent=msg;el.style.display=msg?'block':'none';}
  S.mpStatus=msg;
}

/* ═══════════════════════════════════════
   FLAPPY BIRD MINI GAME
═══════════════════════════════════════ */
let FB={active:false,raf:null,canvas:null,ctx:null};

function openFlappy(){
  const ov=document.getElementById('flappy-overlay');
  if(!ov)return;
  ov.style.display='flex';
  FB.active=true;
  _fbInit();
}
function closeFlappy(){
  const ov=document.getElementById('flappy-overlay');
  if(ov)ov.style.display='none';
  FB.active=false;
  if(FB.raf){cancelAnimationFrame(FB.raf);FB.raf=null;}
}
function _fbInit(){
  const canvas=document.getElementById('flappy-canvas');
  if(!canvas)return;
  FB.canvas=canvas; FB.ctx=canvas.getContext('2d');
  // Input
  const jump=()=>{if(FB.state==='dead'){_fbReset();}else{FB.vy=-5.5;FB.state='playing';}};
  canvas.onclick=jump;
  canvas.ontouchstart=(e)=>{e.preventDefault();jump();};
  // Only add keyboard once
  if(!FB._keyBound){
    document.addEventListener('keydown',e=>{if(e.code==='Space'&&FB.active){e.preventDefault();jump();}});
    FB._keyBound=true;
  }
  _fbReset();
}
function _fbReset(){
  const W=320,H=420;
  FB.W=W;FB.H=H;
  FB.birdX=80;FB.birdY=H/2;FB.vy=0;
  FB.gravity=0.22;FB.flapPower=-5.5;
  FB.pipes=[];FB.pipeTimer=0;FB.pipeGap=145;FB.pipeWidth=52;FB.pipeSpeed=1.6;
  FB.score=0;FB.best=parseInt(localStorage.getItem('fb_best')||'0');
  FB.state='waiting'; // waiting -> playing -> dead
  FB.bgX=0;FB.groundX=0;
  if(FB.raf)cancelAnimationFrame(FB.raf);
  _fbLoop();
}
function _fbLoop(){
  if(!FB.active){return;}
  FB.raf=requestAnimationFrame(_fbLoop);
  _fbUpdate();
  _fbDraw();
}
function _fbUpdate(){
  if(FB.state!=='playing')return;
  // Bird physics
  FB.vy+=FB.gravity;
  FB.birdY+=FB.vy;
  FB.bgX=(FB.bgX-0.5)%FB.W;
  FB.groundX=(FB.groundX-FB.pipeSpeed*1.5)%48;
  // Pipes
  FB.pipeTimer++;
  if(FB.pipeTimer>110){
    FB.pipeTimer=0;
    const minH=50,maxH=FB.H-FB.pipeGap-minH-60;
    const topH=minH+Math.random()*maxH;
    FB.pipes.push({x:FB.W+10,top:topH,scored:false});
  }
  for(let p of FB.pipes){
    p.x-=FB.pipeSpeed;
    if(!p.scored&&p.x+FB.pipeWidth<FB.birdX){p.scored=true;FB.score++;}
  }
  FB.pipes=FB.pipes.filter(p=>p.x>-FB.pipeWidth-10);
  // Collisions
  const bR=13; // bird radius
  for(let p of FB.pipes){
    const inX=FB.birdX+bR>p.x&&FB.birdX-bR<p.x+FB.pipeWidth;
    if(inX&&(FB.birdY-bR<p.top||FB.birdY+bR>p.top+FB.pipeGap)){_fbDie();return;}
  }
  // Floor/ceiling
  if(FB.birdY+bR>FB.H-40){FB.birdY=FB.H-40-bR;_fbDie();return;}
  if(FB.birdY-bR<0){FB.birdY=bR;FB.vy=0;}
}
function _fbDie(){
  FB.state='dead';
  if(FB.score>FB.best){FB.best=FB.score;localStorage.setItem('fb_best',FB.score);}
}
function _fbDraw(){
  const {ctx:c,W,H}=FB;
  // Sky gradient
  const sky=c.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0d0d2e');sky.addColorStop(1,'#1a1a3e');
  c.fillStyle=sky;c.fillRect(0,0,W,H);
  // Scrolling stars/clouds bg
  c.fillStyle='rgba(255,255,255,.06)';
  for(let i=0;i<8;i++){
    const sx=((FB.bgX*0.3+i*45)%W+W)%W;
    c.beginPath();c.arc(sx,20+i*18,2,0,Math.PI*2);c.fill();
  }
  // Pipes
  for(let p of FB.pipes){
    // Top pipe
    const g1=c.createLinearGradient(p.x,0,p.x+FB.pipeWidth,0);
    g1.addColorStop(0,'#1a6b3c');g1.addColorStop(0.4,'#2ecc71');g1.addColorStop(1,'#1a6b3c');
    c.fillStyle=g1;
    c.beginPath();c.roundRect(p.x,0,FB.pipeWidth,p.top-8,4);c.fill();
    // Top cap
    c.fillStyle='#27ae60';
    c.beginPath();c.roundRect(p.x-5,p.top-24,FB.pipeWidth+10,20,6);c.fill();
    // Bottom pipe
    const botY=p.top+FB.pipeGap;
    c.fillStyle=g1;
    c.beginPath();c.roundRect(p.x,botY+8,FB.pipeWidth,H-botY-48,4);c.fill();
    // Bottom cap
    c.fillStyle='#27ae60';
    c.beginPath();c.roundRect(p.x-5,botY+4,FB.pipeWidth+10,20,6);c.fill();
  }
  // Ground
  c.fillStyle='#2d5a1b';c.fillRect(0,H-40,W,40);
  c.fillStyle='#3d7a26';c.fillRect(0,H-40,W,8);
  // Ground tiles
  c.fillStyle='#4a9030';
  for(let i=0;i<8;i++){
    const gx=((FB.groundX+i*48)%W+W)%W;
    c.fillRect(gx,H-40,40,8);
  }
  // Bird
  const bx=FB.birdX,by=FB.birdY;
  const angle=Math.max(-0.5,Math.min(1.2,FB.vy*0.07));
  c.save();c.translate(bx,by);c.rotate(angle);
  // Body
  c.fillStyle='#ffd60a';
  c.beginPath();c.ellipse(0,0,14,11,0,0,Math.PI*2);c.fill();
  // Wing
  c.fillStyle='#ffaa00';
  c.beginPath();c.ellipse(-4,3,8,5,FB.state==='playing'?Math.sin(Date.now()/80)*0.5:0.3,0,Math.PI*2);c.fill();
  // Eye
  c.fillStyle='#fff';c.beginPath();c.arc(6,-3,4,0,Math.PI*2);c.fill();
  c.fillStyle='#1a1a2e';c.beginPath();c.arc(7,-3,2.2,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(8,-4,0.8,0,Math.PI*2);c.fill();
  // Beak
  c.fillStyle='#ff6b35';
  c.beginPath();c.moveTo(12,-1);c.lineTo(18,1);c.lineTo(12,3);c.closePath();c.fill();
  c.restore();
  // Score
  c.fillStyle='#fff';c.font='bold 22px Nunito,sans-serif';c.textAlign='center';
  c.shadowColor='rgba(0,0,0,.8)';c.shadowBlur=6;
  c.fillText(FB.score,W/2,44);c.shadowBlur=0;
  // State overlays
  if(FB.state==='waiting'){
    c.fillStyle='rgba(0,0,0,.55)';c.fillRect(0,0,W,H);
    c.fillStyle='#ffd60a';c.font='bold 26px Bangers,cursive';c.textAlign='center';
    c.fillText('TAP TO START',W/2,H/2-16);
    c.fillStyle='rgba(255,255,255,.5)';c.font='bold 14px Nunito,sans-serif';
    c.fillText('Best: '+FB.best,W/2,H/2+16);
  }
  if(FB.state==='dead'){
    c.fillStyle='rgba(0,0,0,.6)';c.fillRect(0,0,W,H);
    c.fillStyle='#ff4d6d';c.font='bold 30px Bangers,cursive';c.textAlign='center';
    c.fillText('DEAD 💀',W/2,H/2-38);
    c.fillStyle='#ffd60a';c.font='bold 22px Bangers,cursive';
    c.fillText('Score: '+FB.score,W/2,H/2);
    c.fillStyle='rgba(255,255,255,.6)';c.font='bold 15px Nunito,sans-serif';
    c.fillText('Best: '+FB.best,W/2,H/2+26);
    c.fillStyle='#00c2ff';c.font='bold 16px Nunito,sans-serif';
    c.fillText('Tap to play again',W/2,H/2+56);
  }
}
